name: Notify Foundry of a symbol update
on:
  push:
    branches: [main]
    paths:
      - 'branding/assets/symbol.png'
  workflow_dispatch:
permissions: {}
jobs:
  notify:
    if: github.event.repository.private
    uses: sunstriker2009/sun-foundry/.github/workflows/notify-gallery-symbol.yml@09deaa145a8febb19df8b5457abab8cac4cfa494
    secrets:
      app_id: ${{ secrets.SUN_SYMBOL_RELAY_APP_ID }}
      app_private_key: ${{ secrets.SUN_SYMBOL_RELAY_APP_PRIVATE_KEY }}

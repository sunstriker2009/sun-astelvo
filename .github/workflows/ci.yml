name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository-validation:
    name: repository-validation
    needs: [backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository foundation
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -f .github/CODEOWNERS
          test -f docs/REPOSITORY-SETUP.md
      - name: Require successful application checks on PRs
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          set -euo pipefail
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
  backend:
    name: backend
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: dotnet build Sun.Workspace.slnx -c Release
      - run: node --test --test-timeout=15000 tests/host.integration.test.mjs
      - name: Publish and test self-contained host
        shell: bash
        run: |
          dotnet publish src/Sun.Workspace.Host -c Release -r linux-x64 --self-contained true -p:DebugType=None -o artifacts/host/linux-x64
          ASTELVO_HOST_EXECUTABLE="$PWD/artifacts/host/linux-x64/Sun.Workspace.Host" node --test --test-timeout=15000 tests/host.integration.test.mjs
  frontend:
    name: frontend
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
